<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Em Xinh Say Hi seat map</title>
  <desc id="desc">Exhibition hall seat map with GA, SVIP, VIP, CAT1, and CAT2 zones.</desc>
  <rect width="960" height="640" fill="#f8fafc"/>
  <rect x="250" y="42" width="460" height="82" rx="8" fill="#111827"/>
  <text x="480" y="94" text-anchor="middle" font-family="Arial" font-size="30" fill="#ffffff">STAGE</text>
  <g id="zone-svip" data-zone="SVIP" data-ticket-type="SVIP" data-capacity="250">
    <rect x="360" y="152" width="240" height="120" rx="8" fill="#f97316" stroke="#9a3412" stroke-width="3"/>
    <text x="480" y="224" text-anchor="middle" font-family="Arial" font-size="30" fill="#111827">SVIP</text>
  </g>
  <g id="zone-vip" data-zone="VIP" data-ticket-type="VIP" data-capacity="1100">
    <rect x="285" y="292" width="390" height="104" rx="8" fill="#facc15" stroke="#a16207" stroke-width="3"/>
    <text x="480" y="356" text-anchor="middle" font-family="Arial" font-size="30" fill="#111827">VIP</text>
  </g>
  <g id="zone-cat1" data-zone="CAT1" data-ticket-type="CAT1" data-capacity="4000">
    <rect x="90" y="150" width="170" height="246" rx="8" fill="#22c55e" stroke="#166534" stroke-width="3"/>
    <rect x="700" y="150" width="170" height="246" rx="8" fill="#22c55e" stroke="#166534" stroke-width="3"/>
    <text x="175" y="285" text-anchor="middle" font-family="Arial" font-size="27" fill="#052e16">CAT1</text>
    <text x="785" y="285" text-anchor="middle" font-family="Arial" font-size="27" fill="#052e16">CAT1</text>
  </g>
  <g id="zone-cat2" data-zone="CAT2" data-ticket-type="CAT2" data-capacity="6200">
    <rect x="90" y="430" width="780" height="105" rx="8" fill="#38bdf8" stroke="#0369a1" stroke-width="3"/>
    <text x="480" y="494" text-anchor="middle" font-family="Arial" font-size="30" fill="#082f49">CAT2</text>
  </g>
  <g id="zone-ga" data-zone="GA" data-ticket-type="GA" data-capacity="9000">
    <rect x="90" y="555" width="780" height="48" rx="8" fill="#a78bfa" stroke="#6d28d9" stroke-width="3"/>
    <text x="480" y="588" text-anchor="middle" font-family="Arial" font-size="24" fill="#2e1065">GA</text>
  </g>
  <text x="480" y="627" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Object key: seat-maps/em-xinh-say-hi.svg</text>
