<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Anh Trai Say Hi seat map</title>
  <desc id="desc">Interactive-style seat map with GA, SVIP, VIP, CAT1, and CAT2 zones.</desc>
  <rect width="960" height="640" fill="#f8fafc"/>
  <rect x="300" y="40" width="360" height="92" rx="8" fill="#111827"/>
  <text x="480" y="96" text-anchor="middle" font-family="Arial" font-size="30" fill="#ffffff">STAGE</text>
  <g id="zone-svip" data-zone="SVIP" data-ticket-type="SVIP" data-capacity="200">
    <path d="M330 160 H630 L690 290 H270 Z" fill="#f97316" stroke="#9a3412" stroke-width="3"/>
    <text x="480" y="238" text-anchor="middle" font-family="Arial" font-size="32" fill="#111827">SVIP</text>
  </g>
  <g id="zone-vip" data-zone="VIP" data-ticket-type="VIP" data-capacity="1200">
    <path d="M250 310 H710 L780 430 H180 Z" fill="#facc15" stroke="#a16207" stroke-width="3"/>
    <text x="480" y="383" text-anchor="middle" font-family="Arial" font-size="32" fill="#111827">VIP</text>
  </g>
  <g id="zone-cat1" data-zone="CAT1" data-ticket-type="CAT1" data-capacity="4500">
    <path d="M90 160 H260 L170 430 H60 Z" fill="#22c55e" stroke="#166534" stroke-width="3"/>
    <path d="M700 160 H870 L900 430 H790 Z" fill="#22c55e" stroke="#166534" stroke-width="3"/>
    <text x="160" y="304" text-anchor="middle" font-family="Arial" font-size="28" fill="#052e16">CAT1</text>
    <text x="800" y="304" text-anchor="middle" font-family="Arial" font-size="28" fill="#052e16">CAT1</text>
  </g>
  <g id="zone-cat2" data-zone="CAT2" data-ticket-type="CAT2" data-capacity="8000">
    <path d="M80 455 H880 L820 585 H140 Z" fill="#38bdf8" stroke="#0369a1" stroke-width="3"/>
    <text x="480" y="535" text-anchor="middle" font-family="Arial" font-size="32" fill="#082f49">CAT2</text>
  </g>
  <g id="zone-ga" data-zone="GA" data-ticket-type="GA" data-capacity="12000">
    <path d="M40 60 H250 L250 130 H40 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="3"/>
    <path d="M710 60 H920 L920 130 H710 Z" fill="#a78bfa" stroke="#6d28d9" stroke-width="3"/>
    <text x="145" y="105" text-anchor="middle" font-family="Arial" font-size="26" fill="#2e1065">GA</text>
    <text x="815" y="105" text-anchor="middle" font-family="Arial" font-size="26" fill="#2e1065">GA</text>
  </g>
  <text x="480" y="622" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Object key: seat-maps/anh-trai-say-hi.svg</text>
</svg>
