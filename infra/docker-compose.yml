services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticketbox
      POSTGRES_PASSWORD: ticketbox_dev
      POSTGRES_DB: ticketbox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketbox"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ticketbox-redis
    restart: unless-stopped
    command: redis-server --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ticketbox-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ticketbox_minio
      MINIO_ROOT_PASSWORD: ticketbox_minio_dev
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile # Đường dẫn tới Dockerfile của API
    container_name: ticketbox-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ticketbox
      DATABASE_PASSWORD: ticketbox_dev
      DATABASE_NAME: ticketbox
      DATABASE_URL: postgresql://ticketbox:ticketbox_dev@postgres:5432/ticketbox

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379

      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ticketbox_minio
      MINIO_SECRET_KEY: ticketbox_minio_dev
      MINIO_BUCKET_NAME: ticketbox
      FRONTEND_AUDIENCE_URL: http://localhost:3000
      FRONTEND_ADMIN_URL: http://localhost:3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  audience-web:
    build:
      context: ..
      dockerfile: apps/audience-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    container_name: ticketbox-audience-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    depends_on:
      - api

  admin-web:
    build:
      context: ..
      dockerfile: apps/admin-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    container_name: ticketbox-admin-web
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    depends_on:
      - api
  
volumes:
  postgres_data:
  redis_data:
  minio_data:
