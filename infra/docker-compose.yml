services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticketbox
      POSTGRES_PASSWORD: ticketbox_dev
      POSTGRES_DB: ticketbox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketbox"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ticketbox-redis
    restart: unless-stopped
    command: redis-server --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ticketbox-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ticketbox_minio
      MINIO_ROOT_PASSWORD: ticketbox_minio_dev
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile # Đường dẫn tới Dockerfile của API
    container_name: ticketbox-api
    ports:
      - "3001:3001"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ticketbox
      DATABASE_PASSWORD: ticketbox_dev
      DATABASE_NAME: ticketbox

