config:
  target: "{{ $processEnvironment.API_BASE_URL }}"
  phases:
    - duration: 10
      arrivalRate: 20
  defaults:
    headers:
      Content-Type: "application/json"

scenarios:
  - name: "Concert public read load"
    flow:
      - get:
          url: "/concerts?page=1&limit=10"
      - get:
          url: "/concerts/{{ $processEnvironment.CONCERT_ID }}"
